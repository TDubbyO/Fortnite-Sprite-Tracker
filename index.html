                                color: text, fontWeight: 900, fontSize: '1rem', textTransform: 'uppercase', letterSpacing: '0.03em'
                            }}
                        >
                            <div style={{ display: 'flex', alignItems: 'center', gap: '0.6rem', minWidth: 0 }}>
                                <span>
                                    Filters <span style={{ opacity: 0.6, fontWeight: 700, textTransform: 'none', letterSpacing: 'normal' }}>{hasActiveFilters ? '(active)' : ''}</span>
                                </span>
                                {hasActiveFilters && (
                                    <button
                                        onClick={(e) => { e.stopPropagation(); clearFilters(); }}
                                        style={{
                                            padding: '0.3rem 0.7rem', borderRadius: '999px', cursor: 'pointer',
                                            background: 'transparent', color: text, border: `1.5px dashed ${cardBorder}`,
                                            fontSize: '0.7rem', fontWeight: 700, opacity: 0.85, flexShrink: 0
                                        }}
                                    >
                                        ✕ Clear
                                    </button>
                                )}
                            </div>
                            <span style={{ fontSize: '1.2rem', transform: filtersExpanded ? 'rotate(180deg)' : 'none', transition: 'transform 0.2s' }}>▾</span>
                        </button>
                        {filtersExpanded && (
                            <div style={{ padding: '0 1.5rem 1.5rem 1.5rem' }}>
                                <div style={{ position: 'relative', marginBottom: '1.1rem' }}>
                                    <span style={{ position: 'absolute', left: '0.9rem', top: '50%', transform: 'translateY(-50%)', opacity: 0.5, fontSize: '0.95rem', pointerEvents: 'none' }}>🔍</span>
                                    <input
                                        type="text"
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                        placeholder="Search sprites..."
                                        style={{
                                            width: '100%', padding: '0.7rem 2.5rem', borderRadius: '0.6rem',
                                            background: cardBg, border: `1px solid ${cardBorder}`, color: text,
                                            fontSize: '16px', boxSizing: 'border-box'
                                        }}
                                    />
                                    {searchQuery && (
                                        <button
                                            onClick={() => setSearchQuery('')}
                                            style={{
                                                position: 'absolute', right: '0.6rem', top: '50%', transform: 'translateY(-50%)',
                                                background: 'transparent', border: 'none', cursor: 'pointer',
                                                color: text, opacity: 0.6, fontSize: '1rem', padding: '0.3rem'
                                            }}
                                        >
                                            ✕
                                        </button>
                                    )}
                                </div>

                                {renderStatusFilter('Collected', filterCollectedMode, handleSetCollectedMode, 'collected', 'Collected', 'uncollected', 'Uncollected', primary, filterMasteredMode === 'mastered', 'Mastered items are always collected')}
                                {renderStatusFilter('Mastered', filterMasteredMode, handleSetMasteredMode, 'mastered', 'Mastered', 'unmastered', 'Unmastered', tertiary, filterCollectedMode === 'uncollected', 'Uncollected items are never mastered')}

                                <div style={{ display: 'flex', alignItems: 'center', gap: '0.35rem', marginBottom: '0.4rem' }}>
                                    <div style={{ fontSize: '0.7rem', fontWeight: 700, opacity: 0.6, textTransform: 'uppercase', letterSpacing: '0.04em' }}>Variant</div>
                                    <button
                                        onClick={() => setShowVariantHint(h => !h)}
                                        style={{
                                            width: '15px', height: '15px', borderRadius: '50%', border: `1px solid ${cardBorder}`,
                                            background: 'transparent', color: text, fontSize: '0.62rem', fontWeight: 700,
                                            cursor: 'pointer', padding: 0, display: 'flex', alignItems: 'center', justifyContent: 'center',
                                            opacity: 0.6, lineHeight: 1, fontStyle: 'italic', fontFamily: 'Georgia, serif'
                                        }}
                                    >
                                        i
                                    </button>
                                </div>
                                {showVariantHint && (
                                    <div style={{ fontSize: '0.72rem', opacity: 0.75, marginBottom: '0.6rem', lineHeight: 1.5 }}>
                                        Tap a variant to show only that one. Long-press to exclude it instead.
                                    </div>
                                )}
                                <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.5rem', alignItems: 'center' }}>
                                    {ALL_VARIANTS.map(v => {
                                        const isIncluded = filterVariants.includes(v);
                                        const isExcluded = filterExcludedVariants.includes(v);
                                        const variantColor = v === 'Cheat Master' ? '#39FF14' : (v === 'Gold' ? '#fbbf24' : '#94a3b8');
                                        return (
                                            <button
                                                key={v}
                                                onContextMenu={(e) => e.preventDefault()}
                                                onPointerDown={(e) => handleFilterChipPointerDown(e, v)}
                                                onPointerUp={(e) => handleFilterChipPointerUp(e, v)}
                                                onPointerCancel={(e) => handleFilterChipPointerCancel(e, v)}
                                                onPointerLeave={(e) => handleFilterChipPointerCancel(e, v)}
                                                style={{
                                                    padding: '0.5rem 0.9rem', borderRadius: '0.5rem', cursor: 'pointer', fontWeight: 'bold', fontSize: '0.85rem',
                                                    touchAction: 'manipulation', WebkitTouchCallout: 'none',
                                                    background: isExcluded ? '#ef4444' : (isIncluded ? primary : 'transparent'),
                                                    color: (isExcluded || isIncluded) ? '#0f0515' : primary,
                                                    border: `1.5px solid ${isExcluded ? '#ef4444' : primary}`,
                                                    textDecoration: isExcluded ? 'line-through' : 'none'
                                                }}
                                            >
                                                {v}
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>
                        )}
                    </div>

                    {listView ? (
                        <div style={{ display: 'flex', flexDirection: 'column', gap: '0.5rem' }}>
                            {sprites.map(sp => {
                                const spriteVariants = getVariantsForSprite(sp.name);
                                const m = spriteVariants.filter(vv => mastered.includes(sp.name + '-' + vv)).length;
                                const allMastered = spriteVariants.length > 0 && m === spriteVariants.length;
                                const anyVariantMatches = spriteVariants.some(vv => matchesFilters(vv, collected.includes(sp.name + '-' + vv), mastered.includes(sp.name + '-' + vv)));
                                if (!anyVariantMatches || !matchesSearch(sp.name)) return null;
                                return (
                                    <div key={sp.name} style={{ background: cardBg, padding: '0.4rem 0.6rem', borderRadius: '0.6rem', border: allMastered ? `2px solid ${tertiary}` : `1px solid ${cardBorder}`, display: 'flex', alignItems: 'center', gap: '0.6rem', boxShadow: isMasterCollector ? cardGlow : 'none' }}>
                                        <div style={{ width: '38px', height: '38px', borderRadius: '0.4rem', overflow: 'hidden', flexShrink: 0, background: 'rgba(0,0,0,0.1)' }}>
                                            <img
                                                src={getImagePath(sp.name, 'Base')}
                                                {...noCalloutImgProps}
                                                style={{ ...noCalloutImgProps.style, width: '100%', height: '100%', objectFit: 'contain' }}
                                                alt="Base"
                                                onError={(e) => { e.target.style.display = 'none'; }}
                                            />
                                        </div>
                                        <div style={{ display: 'flex', alignItems: 'center', gap: '0.35rem', width: '100px', flexShrink: 0 }}>
                                            <span style={{ width: '7px', height: '7px', borderRadius: '50%', background: sp.color, flexShrink: 0 }} />
                                            <span title={sp.name} style={{ fontSize: '0.72rem', fontWeight: 700, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{sp.name}</span>
                                        </div>
                                        <div style={{ flex: 1, display: 'flex', height: '28px', borderRadius: '0.4rem', overflow: 'hidden', border: `1px solid ${cardBorder}` }}>
                                            {getVariantsForSprite(sp.name).map((variant, i) => {
                                                const isFirst = i === 0;
                                                const isLast = i === getVariantsForSprite(sp.name).length - 1;
                                                const makeEndRadius = (px) => ({
                                                    borderTopLeftRadius: isFirst ? `${px}px` : 0,
                                                    borderBottomLeftRadius: isFirst ? `${px}px` : 0,
                                                    borderTopRightRadius: isLast ? `${px}px` : 0,
                                                    borderBottomRightRadius: isLast ? `${px}px` : 0
                                                });
                                                const endRadius = makeEndRadius(6.4);
                                                const bufferRadius = makeEndRadius(4.4);
                                                const fillRadius = makeEndRadius(2.4);

                                                const applicable = true; // All sprites have all 3 variants
                                                const id = sp.name + '-' + variant;
                                                const isC = collected.includes(id);
                                                const isM = mastered.includes(id);
                                                const matches = applicable && matchesFilters(variant, isC, isM);

                                                if (!matches) {
                                                    return (
                                                        <div
                                                            key={variant}
                                                            title={`${variant} — doesn't match current filters`}
                                                            style={{
                                                                flex: 1, height: '100%',
                                                                borderLeft: i > 0 ? `1px solid ${cardBorder}` : 'none',
                                                                background: HATCH_PATTERN,
                                                                ...endRadius
                                                            }}
                                                        />
                                                    );
                                                }

                                                const variantColor = variant === 'Cheat Master' ? '#39FF14' : (variant === 'Gold' ? '#fbbf24' : '#94a3b8');

                                                return (
                                                    <div
                                                        key={variant}
                                                        title={variant}
                                                        onContextMenu={(e) => e.preventDefault()}
                                                        onPointerDown={(e) => handlePointerDown(e, sp.name, variant)}
                                                        onPointerUp={(e) => handlePointerUp(e, sp.name, variant)}
                                                        onPointerCancel={(e) => handlePointerCancel(e, sp.name, variant)}
                                                        onPointerLeave={(e) => handlePointerCancel(e, sp.name, variant)}
                                                        style={{
                                                            flex: 1, height: '100%', boxSizing: 'border-box',
                                                            borderLeft: i > 0 ? `1px solid ${cardBorder}` : 'none',
                                                            cursor: 'pointer', touchAction: 'manipulation', WebkitTouchCallout: 'none',
                                                            opacity: isC ? 1 : 0.3,
                                                            background: isM ? tertiary : variantColor,
                                                            padding: isM ? '2px' : 0,
                                                            overflow: 'hidden',
                                                            ...endRadius
                                                        }}
                                                    >
                                                        {isM && (
                                                            <div style={{ width: '100%', height: '100%', background: '#000', padding: '2px', boxSizing: 'border-box', overflow: 'hidden', ...bufferRadius }}>
                                                                <div style={{ width: '100%', height: '100%', background: variantColor, ...fillRadius }} />
                                                            </div>
                                                        )}
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    ) : (
                    <div style={{ display: 'grid', gridTemplateColumns: compactView ? 'repeat(auto-fill, minmax(170px, 1fr))' : 'repeat(auto-fill, minmax(300px, 1fr))', gap: compactView ? '0.75rem' : '1.5rem' }}>
                        {sprites.map(sp => {
                            const spriteVariants = getVariantsForSprite(sp.name);
                            const c = spriteVariants.filter(vv => collected.includes(sp.name + '-' + vv)).length;
                            const m = spriteVariants.filter(vv => mastered.includes(sp.name + '-' + vv)).length;
                            const cardPct = spriteVariants.length > 0 ? (c / spriteVariants.length) * 100 : 0;
                            const allMastered = spriteVariants.length > 0 && m === spriteVariants.length;
                            const ringColor = allMastered ? tertiary : primary;
                            const cardShadows = [];
                            if (isMasterCollector) cardShadows.push(cardGlow);
                            if (allMastered) cardShadows.push(`0 0 16px ${tertiary}99`);
                            const anyVariantMatches = spriteVariants.some(vv => matchesFilters(vv, collected.includes(sp.name + '-' + vv), mastered.includes(sp.name + '-' + vv)));
                            if (!anyVariantMatches || !matchesSearch(sp.name)) return null;
                            return (
                                <div key={sp.name} style={{ background: cardBg, padding: compactView ? '0.75rem' : '1.5rem', borderRadius: '0.75rem', border: allMastered ? `2px solid ${tertiary}` : `1px solid ${cardBorder}`, position: 'relative', boxShadow: cardShadows.length > 0 ? cardShadows.join(', ') : 'none' }}>
                                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: compactView ? '0.5rem' : '1rem' }}>
                                        <div style={{ display: 'flex', alignItems: 'center', gap: '0.4rem', minWidth: 0, fontSize: compactView ? '0.85rem' : '1.125rem', fontWeight: 700 }}>
                                            <span style={{ width: compactView ? '7px' : '9px', height: compactView ? '7px' : '9px', borderRadius: '50%', background: sp.color, flexShrink: 0 }} />
                                            <span style={{ overflowWrap: 'break-word' }}>{sp.name}</span>
                                        </div>
                                        <div style={{
                                            width: compactView ? '24px' : '32px', height: compactView ? '24px' : '32px',
                                            borderRadius: '50%', flexShrink: 0, position: 'relative',
                                            background: `conic-gradient(${ringColor} 0%, ${ringColor} ${cardPct}%, rgba(0,0,0,0.2) ${cardPct}%, rgba(0,0,0,0.2) 100%)`,
                                            boxShadow: cardPct === 100 ? `0 0 6px ${ringColor}` : 'none'
                                        }}>
                                            <div style={{
                                                position: 'absolute', inset: compactView ? '3px' : '4px', borderRadius: '50%',
                                                background: bg, display: 'flex', alignItems: 'center', justifyContent: 'center',
                                                fontSize: compactView ? '0.45rem' : '0.55rem', fontWeight: 800, color: text, zIndex: 10
                                            }}>
                                                {c}/{getVariantsForSprite(sp.name).length}
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: compactView ? '0.4rem' : '0.75rem' }}>
                                        {getVariantsForSprite(sp.name).map(vv => {
                                            const id = sp.name + '-' + vv;
                                            const isC = collected.includes(id);
                                            const isM = mastered.includes(id);
                                            const isFilteredOut = !matchesFilters(vv, isC, isM);
                                            return (
                                                <div
                                                    key={vv}
                                                    onContextMenu={(e) => e.preventDefault()}
                                                    onPointerDown={(e) => handlePointerDown(e, sp.name, vv)}
                                                    onPointerUp={(e) => handlePointerUp(e, sp.name, vv)}
                                                    onPointerCancel={(e) => handlePointerCancel(e, sp.name, vv)}
                                                    onPointerLeave={(e) => handlePointerCancel(e, sp.name, vv)}
                                                    style={{
                                                        width: '100%',
                                                        height: compactView ? '62px' : '120px',
                                                        borderRadius: '0.5rem',
                                                        overflow: 'hidden',
                                                        opacity: isFilteredOut ? 0.08 : (isC ? 1 : 0.3),
                                                        filter: isFilteredOut ? 'grayscale(1)' : 'none',
                                                        cursor: 'pointer',
                                                        transition: 'all 0.3s',
                                                        background: 'rgba(0,0,0,0.1)',
                                                        display: 'flex',
                                                        alignItems: 'center',
                                                        justifyContent: 'center',
                                                        touchAction: 'manipulation',
                                                        WebkitTouchCallout: 'none'
                                                    }}
                                                >
                                                    <img 
                                                        src={getImagePath(sp.name, vv)} 
                                                        {...noCalloutImgProps}
                                                        style={{
                                                            ...noCalloutImgProps.style,
                                                            width: '90%', 
                                                            height: '90%', 
                                                            objectFit: 'contain',
                                                            filter: isM ? `drop-shadow(0 0 6px ${tertiary})` : 'none'
                                                        }} 
                                                        alt={vv}
                                                        onError={(e) => { e.target.style.display = 'none'; }}
                                                    />
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                    )}
                </div>
            </div>;
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
