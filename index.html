<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortnite Sprite Collection</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas-pro@latest/dist/html2canvas-pro.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; width: 100%; overflow-x: hidden; }
        body {
            background-image: 
                repeating-linear-gradient(
                    0deg,
                    rgba(57, 255, 20, 0.08) 0px,
                    rgba(57, 255, 20, 0.08) 1px,
                    transparent 1px,
                    transparent 20px
                ),
                repeating-linear-gradient(
                    90deg,
                    rgba(57, 255, 20, 0.08) 0px,
                    rgba(57, 255, 20, 0.08) 1px,
                    transparent 1px,
                    transparent 20px
                );
            background-size: 20px 20px;
            background-attachment: fixed;
        }
        @keyframes chestShake {
            0%, 100% { transform: translate(-50%, -50%) translateX(0) rotate(0deg); }
            20% { transform: translate(-50%, -50%) translateX(-6px) rotate(-3deg); }
            40% { transform: translate(-50%, -50%) translateX(6px) rotate(3deg); }
            60% { transform: translate(-50%, -50%) translateX(-4px) rotate(-2deg); }
            80% { transform: translate(-50%, -50%) translateX(4px) rotate(2deg); }
        }
        @keyframes burstFlash {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.4); }
            35% { opacity: 1; transform: translate(-50%, -50%) scale(1.3); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1.9); }
        }
        @keyframes popIn {
            0% { opacity: 0; transform: translateY(24px) scale(0.5); }
            60% { opacity: 1; transform: translateY(-8px) scale(1.08); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes popInCentered {
            0% { opacity: 0; transform: translate(-50%, -50%) translateY(24px) scale(0.5); }
            60% { opacity: 1; transform: translate(-50%, -50%) translateY(-8px) scale(1.08); }
            100% { opacity: 1; transform: translate(-50%, -50%) translateY(0) scale(1); }
        }
        @keyframes sparkleFloat {
            0% { opacity: 0; transform: rotate(var(--rot, 0deg)) translate(36px) scale(0.3); }
            30% { opacity: 0.8; }
            100% { opacity: 0; transform: rotate(var(--rot, 0deg)) translate(66px) scale(1); }
        }
        @keyframes roam {
            0% { left: var(--x0); top: var(--y0); }
            18% { left: var(--x1); top: var(--y1); }
            32% { left: var(--x1); top: var(--y1); }
            50% { left: var(--x2); top: var(--y2); }
            64% { left: var(--x2); top: var(--y2); }
            82% { left: var(--x3); top: var(--y3); }
            92% { left: var(--x3); top: var(--y3); }
            100% { left: var(--x0); top: var(--y0); }
        }
        @keyframes spriteHop {
            0% { transform: translate(-50%, -50%) translateY(0) scaleY(1); }
            3% { transform: translate(-50%, -50%) translateY(-10px) scaleY(1); }
            6% { transform: translate(-50%, -50%) translateY(0) scaleY(0.85); }
            7% { transform: translate(-50%, -50%) translateY(0) scaleY(1); }
            10% { transform: translate(-50%, -50%) translateY(-10px) scaleY(1); }
            13% { transform: translate(-50%, -50%) translateY(0) scaleY(0.85); }
            14% { transform: translate(-50%, -50%) translateY(0) scaleY(1); }
            18% { transform: translate(-50%, -50%) translateY(0) scaleY(1); }
            32% { transform: translate(-50%, -50%) translateY(0) scaleY(1); }
            35% { transform: translate(-50%, -50%) translateY(-10px) scaleY(1); }
            38% { transform: translate(-50%, -50%) translateY(0) scaleY(0.85); }
            39% { transform: translate(-50%, -50%) translateY(0) scaleY(1); }
            42% { transform: translate(-50%, -50%) translateY(-10px) scaleY(1); }
            45% { transform: translate(-50%, -50%) translateY(0) scaleY(0.85); }
            46% { transform: translate(-50%, -50%) translateY(0) scaleY(1); }
            50% { transform: translate(-50%, -50%) translateY(0) scaleY(1); }
            64% { transform: translate(-50%, -50%) translateY(0) scaleY(1); }
            67% { transform: translate(-50%, -50%) translateY(-10px) scaleY(1); }
            70% { transform: translate(-50%, -50%) translateY(0) scaleY(0.85); }
            71% { transform: translate(-50%, -50%) translateY(0) scaleY(1); }
            74% { transform: translate(-50%, -50%) translateY(-10px) scaleY(1); }
            77% { transform: translate(-50%, -50%) translateY(0) scaleY(0.85); }
            78% { transform: translate(-50%, -50%) translateY(0) scaleY(1); }
            82% { transform: translate(-50%, -50%) translateY(0) scaleY(1); }
            92% { transform: translate(-50%, -50%) translateY(0) scaleY(1); }
            94.5% { transform: translate(-50%, -50%) translateY(-10px) scaleY(1); }
            97% { transform: translate(-50%, -50%) translateY(0) scaleY(0.85); }
            98% { transform: translate(-50%, -50%) translateY(0) scaleY(1); }
            100% { transform: translate(-50%, -50%) translateY(0) scaleY(1); }
        }
        @keyframes glitch {
            0% { clip-path: inset(40% 0 61% 0); transform: translate(2px, -2px); }
            20% { clip-path: inset(92% 0 1% 0); transform: translate(-2px, 2px); }
            40% { clip-path: inset(43% 0 1% 0); transform: translate(-2px, -2px); }
            60% { clip-path: inset(25% 0 58% 0); transform: translate(2px, 2px); }
            80% { clip-path: inset(54% 0 7% 0); transform: translate(2px, -2px); }
            100% { clip-path: inset(58% 0 43% 0); transform: translate(-2px, 2px); }
        }
    </style>
</head>
<body style="margin:0; padding:0; -webkit-user-select: none; user-select: none;">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ============================================
        // NEW SEASON SPRITES (17 sprites, 3 variants each + Crown has 4)
        // ============================================
        const BASE_SPRITES = [
            { name: 'Jackrabbit', color: '#7ec850' },
            { name: 'Shadow', color: '#5a5a5a' },
            { name: 'Bush', color: '#6ba050' },
            { name: 'Tails', color: '#f4a460' },
            { name: 'Killswitch', color: '#8b4513' },
            { name: 'Adventure', color: '#228b22' },
            { name: 'Klombo', color: '#ff69b4' },
            { name: 'Jonesy', color: '#daa520' },
            { name: 'Sonic', color: '#6495ed' },
            { name: 'Crown', color: '#d4af37' },
            { name: '8-Bit', color: '#ff4500' },
            { name: 'Storm Scout', color: '#a9a9a9' },
            { name: 'Overshield', color: '#2b5f8f' },
            { name: 'Mega-Man', color: '#4db8d4' },
            { name: 'X-Ray', color: '#d84040' },
            { name: 'Onigiri', color: '#8b7355' },
        ];

        const sprites = BASE_SPRITES;

        // ============================================
        // ARCHIVED SPRITES (25 old sprites)
        // ============================================
        const ARCHIVED_SPRITES = [
            { name: 'John Wick', color: '#8b5a2b' },
            { name: 'Batman', color: '#1e293b' },
            { name: 'Water', color: '#3b82f6' },
            { name: 'Earth', color: '#16a34a' },
            { name: 'Fire', color: '#ef4444' },
            { name: 'Duck', color: '#facc15' },
            { name: 'Ghost', color: '#dea4c3' },
            { name: 'Dream', color: '#94a3b8' },
            { name: 'Demon', color: '#991b1b' },
            { name: 'Punk', color: '#ec4899' },
            { name: 'King', color: '#7c3aed' },
            { name: 'Burnt Peanut', color: '#d2a679' },
            { name: 'Vini Jr.', color: '#22c55e' },
            { name: 'Zero Point', color: '#c026d3' },
            { name: 'Fishy', color: '#f97316' },
            { name: 'Striker', color: '#000000' },
            { name: 'Aura', color: '#a3a3a3' },
            { name: 'Boss', color: '#dc2626' },
            { name: 'Grim', color: '#475569' },
            { name: 'Air', color: '#d4d0a8' },
            { name: 'Seven', color: '#617a93' },
            { name: 'Pollo', color: '#fbbf24' },
            { name: 'Ironmouse', color: '#fda4af' },
            { name: "Lootin' Llama", color: '#f472b6' },
            { name: 'Peeky Peely', color: '#eab308' },
        ];

        const VARIANT_FILE_SUFFIX = {
            Base: 'base',
            Gold: 'gold',
            'Cheat Master': 'cheat-master',
            'Loot Hacker': 'loot-hacker'
        };

        const getImagePath = (spriteName, variant) => {
            const nameMap = {
                'Jackrabbit': 'Jackrabbit', 'Shadow': 'Shadow', 'Bush': 'Bush',
                'Tails': 'Tails', 'Killswitch': 'Killswitch', 'Adventure': 'Adventure',
                'Klombo': 'Klombo', 'Jonesy': 'Jonesy', 'Sonic': 'Sonic',
                'Crown': 'Crown', '8-Bit': '8-bit', 'Storm Scout': 'Storm-Scout',
                'Overshield': 'Overshield', 'Mega-Man': 'Mega-Man', 'X-Ray': 'X-Ray', 'Onigiri': 'Onigiri',
                'Water': 'Water', 'Earth': 'Earth', 'Fire': 'Fire', 'Duck': 'Duck',
                'Ghost': 'Ghost', 'Dream': 'Dream', 'Demon': 'Demon', 'Punk': 'Punk',
                'King': 'King', 'Burnt Peanut': 'Burntpeanut', 'Zero Point': 'Zeropoint',
                'Fishy': 'Fishy', 'Striker': 'Striker', 'Aura': 'Aura', 'Boss': 'Boss', 'Grim': 'Grim',
                'Seven': 'Seven', 'Air': 'Air', 'Batman': 'Batman', 'Pollo': 'Pollo', 'Vini Jr.': 'Vini-Jr', 'John Wick': 'John-Wick',
                'Ironmouse': 'Ironmouse', "Lootin' Llama": 'Llama', 'Peeky Peely': 'Peely'
            };
            const mappedName = nameMap[spriteName];
            const suffix = VARIANT_FILE_SUFFIX[variant] || variant.toLowerCase();
            return `/images/${mappedName}-${suffix}.webp`;
        };

        const CHEST_CLOSED = '/images/Chest-closed.png';
        const CHEST_OPEN = '/images/Chest-open.png';

        const splitId = (id) => {
            const idx = id.lastIndexOf('-');
            return { name: id.slice(0, idx), variant: id.slice(idx + 1) };
        };

        const noCalloutImgProps = {
            draggable: false,
            onDragStart: (e) => e.preventDefault(),
            onContextMenu: (e) => e.preventDefault(),
            style: {
                WebkitTouchCallout: 'none',
                WebkitUserSelect: 'none',
                userSelect: 'none',
                WebkitUserDrag: 'none',
                pointerEvents: 'none'
            }
        };

        const Pie = ({ col, tot, r, col_val, format }) => {
            const pct = tot > 0 ? (col / tot) * 100 : 0;
            const id = `m${Math.random().toString(36).substr(2, 9)}`;
            const displayText = format === 'fraction' ? `${col}/${tot}` : `${Math.round(pct)}%`;
            
            const rad = (pct * 360) / 100;
            const isLarge = pct > 50 ? 1 : 0;
            const x1 = r + 10 + r * Math.cos(-Math.PI / 2);
            const y1 = r + 10 + r * Math.sin(-Math.PI / 2);
            const x2 = r + 10 + r * Math.cos(-Math.PI / 2 + (rad * Math.PI) / 180);
            const y2 = r + 10 + r * Math.sin(-Math.PI / 2 + (rad * Math.PI) / 180);
            const pathData = `M ${r + 10} ${r + 10} L ${x1} ${y1} A ${r} ${r} 0 ${isLarge} 1 ${x2} ${y2} Z`;
            
            return (
                <svg width={r * 2 + 20} height={r * 2 + 20} viewBox={`0 0 ${r * 2 + 20} ${r * 2 + 20}`} style={{ maxWidth: '100%' }}>
                    <defs>
                        <mask id={id}>
                            <rect width={r * 2 + 20} height={r * 2 + 20} fill="black" />
                            <path d={pathData} fill="white" />
                        </mask>
                    </defs>
                    <circle cx={r + 10} cy={r + 10} r={r} fill={col_val} opacity="0.15" />
                    <path d={pathData} fill={col_val} />
                    <text x={r + 10} y={r + 10} dominantBaseline="central" textAnchor="middle" fontSize={r * 0.55} fontWeight="bold" fill={col_val}>{displayText}</text>
                    <text x={r + 10} y={r + 10} dominantBaseline="central" textAnchor="middle" fontSize={r * 0.55} fontWeight="bold" fill="white" mask={`url(#${id})`}>{displayText}</text>
                </svg>
            );
        };

        const MasterCollectorPopup = ({ onClose, onEnable }) => (
            <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.7)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000 }}>
                <div style={{ background: 'linear-gradient(135deg, #0f0515, #1a0f2e)', padding: '3rem 2rem', borderRadius: '1rem', textAlign: 'center', maxWidth: '400px', border: '2px solid #00FFFF' }}>
                    <div style={{ fontSize: '4rem', marginBottom: '1rem' }}>✨</div>
                    <h2 style={{ color: '#39FF14', fontSize: '2rem', fontWeight: 900, margin: '1rem 0' }}>Master Collector!</h2>
                    <p style={{ color: '#e8f0ff', fontSize: '1rem', marginBottom: '2rem' }}>All sprites collected!</p>
                    <div style={{ display: 'flex', gap: '1rem', justifyContent: 'center' }}>
                        <button onClick={onClose} style={{ padding: '0.75rem 1.5rem', background: 'rgba(255,255,255,0.2)', color: 'white', border: '1px solid #00FFFF', borderRadius: '0.5rem', cursor: 'pointer', fontWeight: 'bold' }}>Later</button>
                        <button onClick={() => { onEnable(); onClose(); }} style={{ padding: '0.75rem 1.5rem', background: '#39FF14', color: '#0f0515', border: 'none', borderRadius: '0.5rem', cursor: 'pointer', fontWeight: 'bold' }}>Activate ✨</button>
                    </div>
                </div>
            </div>
        );

        const ResetConfirmPopup = ({ onClose, onConfirm }) => (
            <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.7)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000 }}>
                <div style={{ background: 'linear-gradient(135deg, #2a0a0a, #4d0f0f)', padding: '3rem 2rem', borderRadius: '1rem', textAlign: 'center', maxWidth: '380px', border: '2px solid #ef4444' }}>
                    <div style={{ fontSize: '3rem', marginBottom: '1rem' }}>⚠️</div>
                    <h2 style={{ color: '#ef4444', fontSize: '1.5rem', fontWeight: 900, margin: '1rem 0' }}>Reset Collection?</h2>
                    <p style={{ color: '#e2e8f0', fontSize: '0.95rem', marginBottom: '2rem' }}>This clears every collected and mastered Sprite. This can't be undone.</p>
                    <div style={{ display: 'flex', gap: '1rem', justifyContent: 'center' }}>
                        <button onClick={onClose} style={{ padding: '0.75rem 1.5rem', background: 'rgba(255,255,255,0.2)', color: 'white', border: '1px solid #ef4444', borderRadius: '0.5rem', cursor: 'pointer', fontWeight: 'bold' }}>Cancel</button>
                        <button onClick={onConfirm} style={{ padding: '0.75rem 1.5rem', background: '#ef4444', color: 'white', border: 'none', borderRadius: '0.5rem', cursor: 'pointer', fontWeight: 'bold' }}>Reset</button>
                    </div>
                </div>
            </div>
        );

        function App() {
            const [collected, setCollected] = useState(() => JSON.parse(localStorage.getItem('c') || '[]'));
            const [viewportWidth, setViewportWidth] = useState(() => window.innerWidth);
            useEffect(() => {
                const onResize = () => setViewportWidth(window.innerWidth);
                window.addEventListener('resize', onResize);
                return () => window.removeEventListener('resize', onResize);
            }, []);
            const shareColumns = viewportWidth >= 700 ? 6 : 4;
            const [mastered, setMastered] = useState(() => JSON.parse(localStorage.getItem('m') || '[]'));
            const [share, setShare] = useState(false);
            const [dark, setDark] = useState(() => JSON.parse(localStorage.getItem('t') || 'true'));
            const [masterCollectorSeen, setMasterCollectorSeen] = useState(() => JSON.parse(localStorage.getItem('mythic') || 'false'));
            const [showMasterCollectorPopup, setShowMasterCollectorPopup] = useState(false);
            const [showResetConfirm, setShowResetConfirm] = useState(false);
            const [masterCollectorActive, setMasterCollectorActive] = useState(() => JSON.parse(localStorage.getItem('mythicActive') || 'false'));
            const [roulette, setRoulette] = useState(false);
            const [roulettePhase, setRoulettePhase] = useState('idle');
            const [scatterItems, setScatterItems] = useState([]);
            const [rouletteResult, setRouletteResult] = useState(null);
            const rouletteTimeoutRef = useRef(null);
            const [frozenPositions, setFrozenPositions] = useState({});
            const stageRef = useRef(null);
            const captureRef = useRef(null);
            const gridWrapperRef = useRef(null);
            const [gridScale, setGridScale] = useState(1);
            const [savingImage, setSavingImage] = useState(false);
            const [showVariantHint, setShowVariantHint] = useState(false);
            const [filterCollectedMode, setFilterCollectedMode] = useState(() => localStorage.getItem('filterCollectedMode') || 'all');
            const [filterMasteredMode, setFilterMasteredMode] = useState(() => localStorage.getItem('filterMasteredMode') || 'all');
            const [viewMode, setViewMode] = useState(() => {
                const saved = localStorage.getItem('viewMode');
                if (saved === 'cozy' || saved === 'compact' || saved === 'list') return saved;
                return JSON.parse(localStorage.getItem('compactView') || 'false') ? 'compact' : 'cozy';
            });
            const compactView = viewMode === 'compact';
            const listView = viewMode === 'list';
            const [statsExpanded, setStatsExpanded] = useState(() => JSON.parse(localStorage.getItem('statsExpanded') || 'false'));
            const [keyExpanded, setKeyExpanded] = useState(() => JSON.parse(localStorage.getItem('keyExpanded') || 'false'));
            const [filtersExpanded, setFiltersExpanded] = useState(() => JSON.parse(localStorage.getItem('filtersExpanded') || 'false'));
            const [filterVariants, setFilterVariants] = useState(() => JSON.parse(localStorage.getItem('filterVariants') || '[]'));
            const [filterExcludedVariants, setFilterExcludedVariants] = useState(() => JSON.parse(localStorage.getItem('filterExcludedVariants') || '[]'));
            const [searchQuery, setSearchQuery] = useState('');
            const [shareMode, setShareMode] = useState('full');
            useEffect(() => { if (share) setShareMode('full'); }, [share]);
            const [rollHistory, setRollHistory] = useState(() => JSON.parse(localStorage.getItem('rollHistory') || '[]'));
            
            // Garden state
            // Glitch effect toggle
            const [glitchOn, setGlitchOn] = useState(() => JSON.parse(localStorage.getItem('glitchOn') || 'false'));

            useEffect(() => { localStorage.setItem('c', JSON.stringify(collected)); }, [collected]);
            useEffect(() => { localStorage.setItem('m', JSON.stringify(mastered)); }, [mastered]);
            useEffect(() => { localStorage.setItem('t', JSON.stringify(dark)); }, [dark]);
            useEffect(() => { localStorage.setItem('mythic', JSON.stringify(masterCollectorSeen)); }, [masterCollectorSeen]);
            useEffect(() => { localStorage.setItem('mythicActive', JSON.stringify(masterCollectorActive)); }, [masterCollectorActive]);
            useEffect(() => { localStorage.setItem('filterCollectedMode', filterCollectedMode); }, [filterCollectedMode]);
            useEffect(() => { localStorage.setItem('filterMasteredMode', filterMasteredMode); }, [filterMasteredMode]);
            useEffect(() => { localStorage.setItem('filterVariants', JSON.stringify(filterVariants)); }, [filterVariants]);
            useEffect(() => { localStorage.setItem('filterExcludedVariants', JSON.stringify(filterExcludedVariants)); }, [filterExcludedVariants]);
            useEffect(() => { localStorage.setItem('viewMode', viewMode); }, [viewMode]);
            useEffect(() => { localStorage.setItem('statsExpanded', JSON.stringify(statsExpanded)); }, [statsExpanded]);
            useEffect(() => { localStorage.setItem('keyExpanded', JSON.stringify(keyExpanded)); }, [keyExpanded]);
            useEffect(() => { localStorage.setItem('filtersExpanded', JSON.stringify(filtersExpanded)); }, [filtersExpanded]);
            useEffect(() => { localStorage.setItem('rollHistory', JSON.stringify(rollHistory)); }, [rollHistory]);
            useEffect(() => { localStorage.setItem('glitchOn', JSON.stringify(glitchOn)); }, [glitchOn]);

            const tot = sprites.length * 3; // 12 sprites × 3 variants = 36
            const col = collected.filter(id => {
                const { name } = splitId(id);
                return sprites.some(sp => sp.name === name);
            }).length;
            const mas = mastered.filter(id => {
                const { name } = splitId(id);
                return sprites.some(sp => sp.name === name);
            }).length;
            const masterCollectorUnlocked = col === tot && tot > 0;
            const isMasterCollector = masterCollectorUnlocked && masterCollectorActive;

            useEffect(() => {
                if (masterCollectorUnlocked && !masterCollectorSeen) {
                    setMasterCollectorSeen(true);
                    setShowMasterCollectorPopup(true);
                    if (navigator.vibrate) {
                        navigator.vibrate([100, 50, 100, 50, 200]);
                    }
                }
            }, [masterCollectorUnlocked, masterCollectorSeen]);

            useEffect(() => {
                if (masterCollectorActive && col < tot) {
                    setMasterCollectorActive(false);
                }
            }, [col, tot, masterCollectorActive]);

            // ============================================
            // COLOR SYSTEM
            // ============================================
            const getDarkModeColors = () => ({
                bg: '#1a0f2e',
                text: '#a8c8f0',
                primary: '#39FF14',
                secondary: '#00FFFF',
                tertiary: '#00FFFF',
                cardBg: 'rgba(57, 255, 20, 0.08)',
                cardBorder: '#39FF14',
                cardGlow: 'none',
                icon: 'rgba(57, 255, 20, 0.15)',
            });

            const getLightModeColors = () => ({
                bg: '#e8f0f8',
                text: '#0a1428',
                primary: '#22aa00',
                secondary: '#00BBDD',
                tertiary: '#00BBDD',
                cardBg: 'rgba(34, 170, 0, 0.08)',
                cardBorder: '#22aa00',
                cardGlow: 'none',
                icon: 'rgba(34, 170, 0, 0.12)',
            });

            const getMasterModeColors = () => ({
                bg: '#0f0515',
                text: '#39FF14',
                primary: '#39FF14',
                secondary: '#00FFFF',
                tertiary: '#00FFFF',
                cardBg: 'rgba(57, 255, 20, 0.15)',
                cardBorder: '#39FF14',
                cardGlow: '0 0 20px rgba(57, 255, 20, 0.6)',
                icon: 'rgba(57, 255, 20, 0.3)',
            });

            const getGardenColors = () => ({
                bg: '#2d5a52',
                text: '#f0f8f6',
                primary: '#39FF14',
                secondary: '#00FFDD',
                tertiary: '#00FFDD',
                cardBg: 'rgba(57, 255, 20, 0.15)',
                cardBorder: '#39FF14',
                cardGlow: 'none',
                icon: 'rgba(57, 255, 20, 0.25)',
            });

            let colors;
            if (isMasterCollector) {
                colors = getMasterModeColors();
            } else if (dark) {
                colors = getDarkModeColors();
            } else {
                colors = getLightModeColors();
            }

            const { bg, text, primary, secondary, tertiary, cardBg, cardBorder, cardGlow, icon } = colors;

            const CompositeImage = ({ spriteName, variants, collectedStatus, masteredStatus, fullOpacity = false }) => {
                return (
                    <div style={{ textAlign: 'center' }}>
                        <div
                            onContextMenu={(e) => e.preventDefault()}
                            style={{ width: '100%', position: 'relative', paddingTop: '100%', borderRadius: '0.5rem', overflow: 'hidden', background: 'rgba(0,0,0,0.1)' }}
                        >
                            <img 
                                src={getImagePath(spriteName, 'Base')}
                                {...noCalloutImgProps}
                                style={{
                                    ...noCalloutImgProps.style,
                                    position: 'absolute',
                                    inset: 0,
                                    width: '100%',
                                    height: '100%',
                                    objectFit: 'contain'
                                }}
                                alt="Base"
                            />
                        </div>
                        
                        <div style={{ display: 'flex', justifyContent: 'center', gap: '0.35rem', marginTop: '0.3rem' }}>
                            {variants.map((variant, idx) => {
                                const isCollected = collectedStatus && collectedStatus[idx];
                                const isMastered = masteredStatus && masteredStatus[idx];
                                const variantColor = variant === 'Cheat Master' ? '#39FF14' : (variant === 'Gold' ? '#fbbf24' : '#94a3b8');
                                
                                return (
                                    <div
                                        key={variant}
                                        title={variant}
                                        style={{
                                            width: '9px', height: '9px', borderRadius: '50%',
                                            background: isMastered ? tertiary : 'transparent',
                                            display: 'flex', alignItems: 'center', justifyContent: 'center',
                                            flexShrink: 0
                                        }}
                                    >
                                        <div style={{
                                            width: isMastered ? '7.5px' : '9px',
                                            height: isMastered ? '7.5px' : '9px',
                                            borderRadius: '50%',
                                            background: isMastered ? '#000' : 'transparent',
                                            display: 'flex', alignItems: 'center', justifyContent: 'center'
                                        }}>
                                            <div style={{
                                                width: isMastered ? '6px' : '9px',
                                                height: isMastered ? '6px' : '9px',
                                                borderRadius: '50%',
                                                background: variantColor,
                                                opacity: fullOpacity || isCollected ? 1 : 0.3
                                            }} />
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                );
            };

            const ALL_VARIANTS = ['Base', 'Gold', 'Cheat Master'];

            const getVariantsForSprite = (spriteName) => {
                return spriteName === 'Crown' 
                    ? ['Base', 'Gold', 'Cheat Master', 'Loot Hacker']
                    : ALL_VARIANTS;
            };

            const matchesFilters = (variant, isCollected, isMastered) => {
                if (filterExcludedVariants.includes(variant)) return false;
                if (filterVariants.length > 0 && !filterVariants.includes(variant)) return false;
                if (filterCollectedMode === 'collected' && !isCollected) return false;
                if (filterCollectedMode === 'uncollected' && isCollected) return false;
                if (filterMasteredMode === 'mastered' && !isMastered) return false;
                if (filterMasteredMode === 'unmastered' && isMastered) return false;
                return true;
            };

            const hasActiveFilters = filterCollectedMode !== 'all' || filterMasteredMode !== 'all' || filterVariants.length > 0 || filterExcludedVariants.length > 0;

            const renderVariantChips = (numeratorFn, format) => (
                <div style={{ display: 'flex', flexWrap: 'wrap', justifyContent: 'center', gap: '0.35rem', marginTop: '0.6rem' }}>
                    {ALL_VARIANTS.map(v => {
                        const t = sprites.filter(sp => true).length; // All 12 sprites have all 3 variants
                        const n = numeratorFn(v);
                        const label = format === 'percentage' ? `${t > 0 ? Math.round((n / t) * 100) : 0}%` : `${n}/${t}`;
                        return (
                            <div key={v} style={{ display: 'flex', alignItems: 'center', gap: '0.25rem', fontSize: '0.65rem', fontWeight: 700, background: cardBg, border: `1px solid ${cardBorder}`, borderRadius: '999px', padding: '0.15rem 0.45rem' }}>
                                <span style={{ width: '7px', height: '7px', borderRadius: '50%', background: v === 'Cheat Master' ? '#39FF14' : (v === 'Gold' ? '#fbbf24' : '#94a3b8'), flexShrink: 0 }} />
                                <span>{label}</span>
                            </div>
                        );
                    })}
                </div>
            );

            const HATCH_PATTERN = 'repeating-linear-gradient(45deg, rgba(148,163,184,0.22), rgba(148,163,184,0.22) 4px, transparent 4px, transparent 8px)';

            const renderStatusFilter = (label, mode, setMode, positiveVal, positiveLabel, negativeVal, negativeLabel, color, rowDisabled = false, disabledReason) => {
                const options = [['all', 'All'], [positiveVal, positiveLabel], [negativeVal, negativeLabel]];
                return (
                    <div style={{ marginBottom: '1rem' }}>
                        <div style={{ fontSize: '0.7rem', fontWeight: 700, opacity: 0.6, marginBottom: '0.4rem', textTransform: 'uppercase', letterSpacing: '0.04em' }}>{label}</div>
                        <div style={{ display: 'flex', border: `1.5px solid ${rowDisabled ? 'rgba(148,163,184,0.35)' : color}`, borderRadius: '0.5rem', overflow: 'hidden' }}>
                            {options.map(([val, txt], i) => (
                                <button
                                    key={val}
                                    onClick={() => !rowDisabled && setMode(val)}
                                    disabled={rowDisabled}
                                    title={rowDisabled ? disabledReason : undefined}
                                    style={{
                                        flex: 1, padding: '0.65rem 0.3rem', border: 'none',
                                        cursor: rowDisabled ? 'default' : 'pointer',
                                        borderLeft: i > 0 ? `1px solid ${rowDisabled ? 'rgba(148,163,184,0.35)' : (mode === val ? 'rgba(255,255,255,0.4)' : color)}` : 'none',
                                        background: rowDisabled ? HATCH_PATTERN : (mode === val ? color : 'transparent'),
                                        color: rowDisabled ? 'rgba(148,163,184,0.75)' : (mode === val ? '#0a1428' : text),
                                        fontWeight: 'bold', fontSize: '0.78rem'
                                    }}
                                >
                                    {txt}
                                </button>
                            ))}
                        </div>
                    </div>
                );
            };

            const handleSetCollectedMode = (val) => {
                setFilterCollectedMode(val);
                if (val === 'uncollected') setFilterMasteredMode('all');
            };

            const handleSetMasteredMode = (val) => {
                setFilterMasteredMode(val);
                if (val === 'mastered') setFilterCollectedMode('all');
            };

            const toggleVariantFilter = (variant) => {
                setFilterExcludedVariants(v => v.includes(variant) ? v.filter(x => x !== variant) : v);
                setFilterVariants(v => v.includes(variant) ? v.filter(x => x !== variant) : [...v, variant]);
            };

            const toggleVariantExclude = (variant) => {
                setFilterVariants(v => v.includes(variant) ? v.filter(x => x !== variant) : v);
                setFilterExcludedVariants(v => v.includes(variant) ? v.filter(x => x !== variant) : [...v, variant]);
            };

            const clearFilters = () => {
                setFilterCollectedMode('all');
                setFilterMasteredMode('all');
                setFilterVariants([]);
                setFilterExcludedVariants([]);
            };

            const matchesSearch = (name) => !searchQuery.trim() || name.toLowerCase().includes(searchQuery.trim().toLowerCase());

            const getFilterSummaryText = () => {
                const parts = [];
                if (filterCollectedMode !== 'all') parts.push(filterCollectedMode === 'collected' ? 'Collected' : 'Uncollected');
                if (filterMasteredMode !== 'all') parts.push(filterMasteredMode === 'mastered' ? 'Mastered' : 'Unmastered');
                if (filterVariants.length > 0) parts.push(filterVariants.join(', '));
                if (filterExcludedVariants.length > 0) parts.push(`Excluding ${filterExcludedVariants.join(', ')}`);
                if (searchQuery.trim()) parts.push(`"${searchQuery.trim()}"`);
                return parts.length > 0 ? parts.join(' • ') : 'All Sprites';
            };

            const resetCollection = () => {
                setCollected([]);
                setMastered([]);
                setMasterCollectorSeen(false);
                setShowResetConfirm(false);
            };

            const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

            const saveCollectionImage = async () => {
                if (!captureRef.current || savingImage) return;
                setSavingImage(true);
                try {
                    let waited = 0;
                    while (!window.html2canvas && waited < 4000) {
                        await new Promise(res => setTimeout(res, 100));
                        waited += 100;
                    }
                    if (!window.html2canvas) {
                        alert("Couldn't load the image export tool — check your internet connection and try again.");
                        setSavingImage(false);
                        return;
                    }

                    const imgs = Array.from(captureRef.current.querySelectorAll('img'));
                    await Promise.all(imgs.map(img => img.complete ? Promise.resolve() : new Promise(res => {
                        img.addEventListener('load', res, { once: true });
                        img.addEventListener('error', res, { once: true });
                    })));

                    void captureRef.current.offsetHeight;

                    const gridCanvas = await window.html2canvas(captureRef.current, {
                        backgroundColor: typeof bg === 'string' && !bg.includes('gradient') ? bg : '#1a0f2e',
                        scale: 2,
                        useCORS: true,
                        logging: false
                    });

                    const titleHeight = Math.round(gridCanvas.width / (shareMode === 'filtered' ? 4.3 : 5.2));
                    const titleFontSize = Math.round(gridCanvas.width / 10.5);
                    const titleFont = `400 ${titleFontSize}px "Anton"`;
                    const subtitleFontSize = Math.round(gridCanvas.width / 30);
                    const subtitleFont = `600 ${subtitleFontSize}px -apple-system, sans-serif`;
                    try { await document.fonts.load(titleFont); } catch (err) {}

                    const finalCanvas = document.createElement('canvas');
                    finalCanvas.width = gridCanvas.width;
                    finalCanvas.height = gridCanvas.height + titleHeight;
                    const ctx = finalCanvas.getContext('2d');
                    ctx.fillStyle = '#1a0f2e';
                    ctx.fillRect(0, 0, finalCanvas.width, finalCanvas.height);

                    const gradient = ctx.createLinearGradient(0, 0, finalCanvas.width, 0);
                    gradient.addColorStop(0, '#22BB00');
                    gradient.addColorStop(0.5, '#39FF14');
                    gradient.addColorStop(1, '#00FFFF');
                    ctx.fillStyle = gradient;
                    ctx.font = titleFont;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('MY SPRITE VAULT', finalCanvas.width / 2, titleHeight * (shareMode === 'filtered' ? 0.38 : 0.5));

                    if (shareMode === 'filtered') {
                        ctx.fillStyle = '#e8f0ff';
                        ctx.font = subtitleFont;
                        ctx.fillText(getFilterSummaryText(), finalCanvas.width / 2, titleHeight * 0.74);
                    }

                    ctx.drawImage(gridCanvas, 0, titleHeight);

                    const canvas = finalCanvas;
                    canvas.toBlob(async (blob) => {
                        if (!blob) { setSavingImage(false); return; }
                        const fileName = 'sprite-collection.png';
                        const file = new File([blob], fileName, { type: 'image/png' });
                        if (navigator.canShare && navigator.canShare({ files: [file] })) {
                            try {
                                await navigator.share({ files: [file], title: 'My Sprite Collection' });
                                setSavingImage(false);
                                return;
                            } catch (err) {
                                // Fall through to download
                            }
                        }
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = fileName;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        setTimeout(() => URL.revokeObjectURL(url), 1000);
                        setSavingImage(false);
                    }, 'image/png');
                } catch (err) {
                    console.error('Failed to save collection image', err);
                    alert('Something went wrong generating the image: ' + (err && err.message ? err.message : 'unknown error') + '. Please try again.');
                    setSavingImage(false);
                }
            };

            const CHEST_EXCLUDE_RADIUS = 21;
            const keepClearOfChest = (x, y) => {
                const dx = x - 50, dy = y - 50;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist >= CHEST_EXCLUDE_RADIUS) return { x, y };
                const angle = dist === 0 ? Math.random() * Math.PI * 2 : Math.atan2(dy, dx);
                const pushed = CHEST_EXCLUDE_RADIUS + Math.random() * 6;
                return {
                    x: clamp(50 + Math.cos(angle) * pushed, 4, 96),
                    y: clamp(50 + Math.sin(angle) * pushed, 4, 92)
                };
            };

            const generateScatterItems = (pool) => {
                const staggerStep = Math.max(6, Math.min(30, Math.floor(360 / pool.length)));
                return pool.map(id => {
                    const home = keepClearOfChest(10 + Math.random() * 80, 10 + Math.random() * 75);
                    const jitter = () => keepClearOfChest(
                        clamp(home.x + (Math.random() * 26 - 13), 4, 96),
                        clamp(home.y + (Math.random() * 26 - 13), 4, 92)
                    );
                    const roamDuration = 9 + Math.random() * 7;
                    return {
                        id, xPct: home.x, yPct: home.y,
                        wp: [jitter(), jitter(), jitter()],
                        roamDuration,
                        roamDelay: Math.random() * 3,
                        gatherDelay: Math.random() * staggerStep * pool.length * 0.6
                    };
                });
            };

            const generateGardenScatterItems = () => {
                return ARCHIVED_SPRITES.map(sp => {
                    const home = { x: 10 + Math.random() * 80, y: 10 + Math.random() * 75 };
                    const jitter = () => ({
                        x: clamp(home.x + (Math.random() * 26 - 13), 4, 96),
                        y: clamp(home.y + (Math.random() * 26 - 13), 4, 92)
                    });
                    const roamDuration = 9 + Math.random() * 7;
                    return {
                        name: sp.name,
                        xPct: home.x,
                        yPct: home.y,
                        wp: [jitter(), jitter(), jitter()],
                        roamDuration,
                        roamDelay: Math.random() * 3
                    };
                });
            };

            const getRoulettePool = () => collected.filter(id => {
                const { name, variant } = splitId(id);
                return sprites.some(sp => sp.name === name) && matchesFilters(variant, true, mastered.includes(id));
            });

            const rouletteItemRefs = useRef({});
            const longPressTimers = useRef({});
            const longPressFlag = useRef({});
            const filterChipLongPressTimers = useRef({});
            const filterChipLongPressFlag = useRef({});
            const activePress = useRef(null);

            const resolvePress = () => {
                const press = activePress.current;
                if (!press) return;
                activePress.current = null;
                const { n, v, id } = press;
                const isLongPress = longPressFlag.current[id];
                if (longPressTimers.current[id]) {
                    clearTimeout(longPressTimers.current[id]);
                    delete longPressTimers.current[id];
                }
                if (!isLongPress) {
                    toggle(n, v);
                }
                longPressFlag.current[id] = false;
            };

            const cancelPress = () => {
                const press = activePress.current;
                if (!press) return;
                if (longPressTimers.current[press.id]) {
                    clearTimeout(longPressTimers.current[press.id]);
                    delete longPressTimers.current[press.id];
                }
                longPressFlag.current[press.id] = false;
                activePress.current = null;
            };

            const handlePointerDown = (e, n, v) => {
                e.preventDefault();
                const id = n + '-' + v;
                if (longPressTimers.current[id]) {
                    clearTimeout(longPressTimers.current[id]);
                    delete longPressTimers.current[id];
                }
                longPressFlag.current[id] = false;
                activePress.current = { n, v, id };
                try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
                longPressTimers.current[id] = setTimeout(() => {
                    longPressFlag.current[id] = true;
                    longPress(n, v);
                }, 500);
            };

            const handlePointerUp = (e, n, v) => {
                resolvePress();
            };

            const handlePointerCancel = (e, n, v) => {
                cancelPress();
            };

            useEffect(() => {
                const onWindowPointerUp = () => resolvePress();
                const onWindowPointerCancel = () => cancelPress();
                window.addEventListener('pointerup', onWindowPointerUp);
                window.addEventListener('pointercancel', onWindowPointerCancel);
                return () => {
                    window.removeEventListener('pointerup', onWindowPointerUp);
                    window.removeEventListener('pointercancel', onWindowPointerCancel);
                };
            }, []);

            const handleFilterChipPointerDown = (e, variant) => {
                e.preventDefault();
                if (filterChipLongPressTimers.current[variant]) {
                    clearTimeout(filterChipLongPressTimers.current[variant]);
                    delete filterChipLongPressTimers.current[variant];
                }
                filterChipLongPressFlag.current[variant] = false;
                try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
                filterChipLongPressTimers.current[variant] = setTimeout(() => {
                    filterChipLongPressFlag.current[variant] = true;
                    if (navigator.vibrate) navigator.vibrate(60);
                    toggleVariantExclude(variant);
                }, 500);
            };

            const handleFilterChipPointerUp = (e, variant) => {
                const isLongPress = filterChipLongPressFlag.current[variant];
                if (filterChipLongPressTimers.current[variant]) {
                    clearTimeout(filterChipLongPressTimers.current[variant]);
                    delete filterChipLongPressTimers.current[variant];
                }
                if (!isLongPress) {
                    toggleVariantFilter(variant);
                }
                filterChipLongPressFlag.current[variant] = false;
            };

            const handleFilterChipPointerCancel = (e, variant) => {
                if (filterChipLongPressTimers.current[variant]) {
                    clearTimeout(filterChipLongPressTimers.current[variant]);
                    delete filterChipLongPressTimers.current[variant];
                }
                filterChipLongPressFlag.current[variant] = false;
            };

            const resetToIdle = () => {
                if (rouletteTimeoutRef.current) {
                    clearTimeout(rouletteTimeoutRef.current);
                    rouletteTimeoutRef.current = null;
                }
                setRouletteResult(null);
                setFrozenPositions({});
                setRoulettePhase('idle');
                const pool = getRoulettePool();
                setScatterItems(pool.length > 0 ? generateScatterItems(pool) : []);
            };

            const resetRoulette = () => {
                if (rouletteTimeoutRef.current) {
                    clearTimeout(rouletteTimeoutRef.current);
                    rouletteTimeoutRef.current = null;
                }
                setRoulettePhase('idle');
                setScatterItems([]);
                setFrozenPositions({});
                setRouletteResult(null);
            };

            const openRoulette = () => {
                resetRoulette();
                const pool = getRoulettePool();
                setScatterItems(pool.length > 0 ? generateScatterItems(pool) : []);
                setRoulette(true);
            };

            const startRoll = () => {
                const pool = getRoulettePool();
                if (pool.length === 0 || scatterItems.length === 0) return;
                if (rouletteTimeoutRef.current) clearTimeout(rouletteTimeoutRef.current);
                setRouletteResult(null);

                const container = stageRef.current;
                const frozen = {};
                if (container) {
                    const rect = container.getBoundingClientRect();
                    scatterItems.forEach(item => {
                        const el = rouletteItemRefs.current[item.id];
                        if (el) {
                            const r = el.getBoundingClientRect();
                            const cx = r.left + r.width / 2 - rect.left;
                            const cy = r.top + r.height / 2 - rect.top;
                            frozen[item.id] = {
                                x: clamp((cx / rect.width) * 100, 0, 100),
                                y: clamp((cy / rect.height) * 100, 0, 100)
                            };
                        }
                    });
                }
                setFrozenPositions(frozen);

                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        setRoulettePhase('gather');
                        const maxDelay = Math.max(0, ...scatterItems.map(it => it.gatherDelay));
                        const gatherDuration = maxDelay + 700;

                        rouletteTimeoutRef.current = setTimeout(() => {
                            setRoulettePhase('shake');
                            if (navigator.vibrate) navigator.vibrate(40);
                            rouletteTimeoutRef.current = setTimeout(() => {
                                const finalId = pool[Math.floor(Math.random() * pool.length)];
                                setRoulettePhase('settle');
                                requestAnimationFrame(() => {
                                    requestAnimationFrame(() => {
                                        setRoulettePhase('burst');
                                        setRouletteResult(finalId);
                                        setRollHistory(prev => [finalId, ...prev].slice(0, 5));
                                        if (navigator.vibrate) navigator.vibrate([50, 30, 80]);
                                    });
                                });
                            }, 650);
                        }, gatherDuration);
                    });
                });
            };

            useEffect(() => {
                return () => { if (rouletteTimeoutRef.current) clearTimeout(rouletteTimeoutRef.current); };
            }, []);

            const toggle = (n, v) => {
                const id = n + '-' + v;
                setCollected(p => p.includes(id) ? p.filter(x => x !== id) : [...p, id]);
                setMastered(p => p.filter(x => x !== id));
            };

            const longPress = (n, v) => {
                const id = n + '-' + v;
                const c = collected.includes(id);
                const m = mastered.includes(id);
                
                if (navigator.vibrate) navigator.vibrate(60);
                
                if (!c) { 
                    setCollected(p => [...p, id]); 
                    setMastered(p => [...p, id]); 
                }
                else if (!m) { 
                    setMastered(p => [...p, id]); 
                }
                else { 
                    setMastered(p => p.filter(x => x !== id)); 
                }
            };

            // ============================================
            // GLITCH TITLE COMPONENT
            // ============================================
            const GlitchTitle = ({ children, style = {} }) => {
                const handleClick = () => {
                    setGlitchOn(true);
                    setTimeout(() => setGlitchOn(false), 2000);
                };

                return (
                    <div
                        onClick={handleClick}
                        style={{
                            cursor: 'pointer',
                            position: 'relative',
                            background: 'radial-gradient(ellipse at 50% 50%, #39FF14 45%, #22BB00 100%)',
                            backgroundClip: 'text',
                            WebkitBackgroundClip: 'text',
                            WebkitTextFillColor: 'transparent',
                            fontSize: 'inherit',
                            fontFamily: 'inherit',
                            fontWeight: 'inherit',
                            letterSpacing: 'inherit',
                            textTransform: 'inherit',
                            ...style
                        }}
                        title="Click to trigger glitch"
                    >
                        {glitchOn && (
                            <>
                                <div style={{
                                    position: 'absolute',
                                    inset: 0,
                                    background: 'radial-gradient(ellipse at 50% 50%, #39FF14 45%, #22BB00 100%)',
                                    backgroundClip: 'text',
                                    WebkitBackgroundClip: 'text',
                                    WebkitTextFillColor: 'transparent',
                                    animation: 'glitch 0.15s infinite',
                                    zIndex: 1,
                                    fontSize: 'inherit',
                                    fontFamily: 'inherit',
                                    fontWeight: 'inherit',
                                    letterSpacing: 'inherit',
                                    textTransform: 'inherit',
                                }}>
                                    {children}
                                </div>
                                <div style={{
                                    position: 'absolute',
                                    inset: 0,
                                    background: 'radial-gradient(ellipse at 50% 50%, #39FF14 45%, #22BB00 100%)',
                                    backgroundClip: 'text',
                                    WebkitBackgroundClip: 'text',
                                    WebkitTextFillColor: 'transparent',
                                    animation: 'glitch 0.15s infinite reverse',
                                    zIndex: 0,
                                    fontSize: 'inherit',
                                    fontFamily: 'inherit',
                                    fontWeight: 'inherit',
                                    letterSpacing: 'inherit',
                                    textTransform: 'inherit',
                                    opacity: 0.6,
                                }}>
                                    {children}
                                </div>
                            </>
                        )}
                        <span style={{
                            background: 'radial-gradient(ellipse at 50% 50%, #39FF14 45%, #22BB00 100%)',
                            backgroundClip: 'text',
                            WebkitBackgroundClip: 'text',
                            WebkitTextFillColor: 'transparent',
                            fontSize: 'inherit',
                            fontFamily: 'inherit',
                            fontWeight: 'inherit',
                            letterSpacing: 'inherit',
                            textTransform: 'inherit',
                            filter: glitchOn ? 'drop-shadow(0 0 10px rgba(57, 255, 20, 0.8))' : 'none',
                            zIndex: glitchOn ? 2 : 'auto',
                            display: 'block'
                        }}>
                            {children}
                        </span>
                    </div>
                );
            };

            // Main app view
            if (roulette) {
                const pool = getRoulettePool();
                const resultInfo = rouletteResult ? splitId(rouletteResult) : null;
                const isBusy = roulettePhase === 'gather' || roulettePhase === 'shake' || roulettePhase === 'settle';
                const goBack = () => { resetRoulette(); setRoulette(false); };

                return <div style={{ width: '100%', height: '100dvh', background: bg, color: text, padding: '1.5rem 1rem', boxSizing: 'border-box', display: 'flex', flexDirection: 'column', alignItems: 'center', overflow: 'hidden' }}>
                    <div style={{ width: '100%', maxWidth: '480px', display: 'flex', justifyContent: 'space-between', marginBottom: '0.75rem', flexShrink: 0 }}>
                        <button onClick={goBack} style={{ padding: '0.5rem 1rem', background: icon, color: primary, border: 'none', borderRadius: '0.5rem', cursor: 'pointer' }}>← Back</button>
                        <div style={{ display: 'flex', gap: '0.5rem' }}>
                            <button onClick={() => setDark(!dark)} style={{ padding: '0.5rem 1rem', background: icon, color: primary, border: 'none', borderRadius: '0.5rem', cursor: 'pointer' }}>{dark ? '☀️' : '🌙'}</button>
